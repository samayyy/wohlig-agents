apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wohlig-agents
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents
spec:
  parentRefs:
    - name: pocketstudio-gateway
      namespace: gateway
  hostnames:
    - agents.pocketstudio.ai
  rules:
    # All traffic goes directly to wohlig-agents (Paperclip has its own auth).
    # 3600s timeout: agent runs and long-polling SSE streams can last several minutes.
    # Timeout is set via GCPBackendPolicy (timeoutSec: 3600) — HTTPRoute-level
    # timeouts are not supported on this GKE gateway controller version (GWCER104).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: wohlig-agents
          port: 3100
