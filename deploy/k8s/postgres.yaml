apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wohlig-agents-postgres
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents-postgres
spec:
  serviceName: wohlig-agents-postgres
  replicas: 1
  selector:
    matchLabels:
      app: wohlig-agents-postgres
  template:
    metadata:
      labels:
        app: wohlig-agents-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: wohlig_agents
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "wohlig_agents", "-d", "wohlig_agents"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wohlig_agents", "-d", "wohlig_agents"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wohlig-agents-postgres
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents-postgres
spec:
  type: ClusterIP
  selector:
    app: wohlig-agents-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
