# Secret stubs — ArgoCD creates the empty shells; actual data is applied out-of-band.
# ArgoCD is configured to ignore /data field differences for this secret.
# The Prune=false annotation prevents ArgoCD from ever deleting it once created.
#
# Apply actual values once with:
#   kubectl create secret generic wohlig-agents-secrets -n pocketstudio-prod \
#     --from-literal=DATABASE_URL='postgres://wohlig_agents:<pass>@wohlig-agents-postgres:5432/wohlig_agents' \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GOOGLE_CLIENT_ID='<id>' \
#     --from-literal=GOOGLE_CLIENT_SECRET='<secret>' \
#     --from-literal=POSTGRES_USER='wohlig_agents' \
#     --from-literal=POSTGRES_PASSWORD='<pass>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: wohlig-agents-secrets
  namespace: pocketstudio-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
