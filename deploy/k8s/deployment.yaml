apiVersion: apps/v1
kind: Deployment
metadata:
  name: wohlig-agents
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wohlig-agents
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wohlig-agents
    spec:
      containers:
        - name: wohlig-agents
          image: asia-south1-docker.pkg.dev/wohlig/pocketstudio/wohlig-agents:f7c1f01
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: PAPERCLIP_PUBLIC_URL
              value: "https://agents.pocketstudio.ai"
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: "authenticated"
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: "public"
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: "agents.pocketstudio.ai"
            - name: SERVE_UI
              value: "true"
            # Auth
            - name: PAPERCLIP_AUTH_BASE_URL_MODE
              value: "explicit"
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: "false"
            # Heartbeat scheduler for agent wake-ups
            - name: HEARTBEAT_SCHEDULER_ENABLED
              value: "true"
            - name: HEARTBEAT_SCHEDULER_INTERVAL_MS
              value: "30000"
            # Disable telemetry for self-hosted
            - name: PAPERCLIP_TELEMETRY_DISABLED
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            # Instance identity
            - name: PAPERCLIP_INSTANCE_ID
              value: "default"
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: DATABASE_URL
            # Auth secrets
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_ID
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_SECRET
            # LLM API keys — available to agents via opencode_local adapter
            # OPENAI_BASE_URL points to Ollama cloud OpenAI-compatible endpoint
            - name: OPENAI_BASE_URL
              value: "https://api.ollama.ai/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: OLLAMA_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
          securityContext: {}
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: wohlig-agents-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wohlig-agents-pvc
  namespace: pocketstudio-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard-rwo
