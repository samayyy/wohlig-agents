apiVersion: apps/v1
kind: Deployment
metadata:
  name: wohlig-agents
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wohlig-agents
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wohlig-agents
    spec:
      initContainers:
        # Writes the OpenCode provider config to the PVC so the opencode_local
        # adapter sees Ollama cloud as a named provider with the correct models.
        # Uses @ai-sdk/openai-compatible pointing at api.ollama.ai/v1.
        # Overwrites on every pod start to keep the API key current.
        - name: opencode-config-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /paperclip/.config/opencode
              cat > /paperclip/.config/opencode/opencode.json << EOF
              {
                "\$schema": "https://opencode.ai/config.json",
                "provider": {
                  "ollama": {
                    "npm": "@ai-sdk/openai-compatible",
                    "name": "Ollama Cloud",
                    "options": {
                      "baseURL": "https://api.ollama.ai/v1",
                      "apiKey": "${OLLAMA_API_KEY}"
                    },
                    "models": {
                      "deepseek-v4-pro":            { "name": "DeepSeek V4 Pro" },
                      "deepseek-v4-flash":          { "name": "DeepSeek V4 Flash" },
                      "deepseek-v3.2":              { "name": "DeepSeek V3.2" },
                      "deepseek-v3.1:671b":         { "name": "DeepSeek V3.1 671B" },
                      "kimi-k2:1t":                 { "name": "Kimi K2 1T" },
                      "kimi-k2.6":                  { "name": "Kimi K2.6" },
                      "kimi-k2.5":                  { "name": "Kimi K2.5" },
                      "kimi-k2-thinking":           { "name": "Kimi K2 Thinking" },
                      "qwen3.5:397b":               { "name": "Qwen 3.5 397B" },
                      "qwen3-coder:480b":           { "name": "Qwen 3 Coder 480B" },
                      "qwen3-coder-next":           { "name": "Qwen 3 Coder Next" },
                      "qwen3-next:80b":             { "name": "Qwen 3 Next 80B" },
                      "qwen3-vl:235b-instruct":     { "name": "Qwen 3 VL 235B Instruct" },
                      "qwen3-vl:235b":              { "name": "Qwen 3 VL 235B" },
                      "glm-5.1":                    { "name": "GLM-5.1" },
                      "glm-5":                      { "name": "GLM-5" },
                      "glm-4.7":                    { "name": "GLM-4.7" },
                      "glm-4.6":                    { "name": "GLM-4.6" },
                      "gemma4:31b":                 { "name": "Gemma 4 31B" },
                      "gemma3:27b":                 { "name": "Gemma 3 27B" },
                      "gemma3:12b":                 { "name": "Gemma 3 12B" },
                      "gemma3:4b":                  { "name": "Gemma 3 4B" },
                      "mistral-large-3:675b":       { "name": "Mistral Large 3 675B" },
                      "devstral-2:123b":            { "name": "Devstral 2 123B" },
                      "devstral-small-2:24b":       { "name": "Devstral Small 2 24B" },
                      "ministral-3:14b":            { "name": "Ministral 3 14B" },
                      "ministral-3:8b":             { "name": "Ministral 3 8B" },
                      "ministral-3:3b":             { "name": "Ministral 3 3B" },
                      "cogito-2.1:671b":            { "name": "Cogito 2.1 671B" },
                      "nemotron-3-super":           { "name": "Nemotron 3 Super" },
                      "nemotron-3-nano:30b":        { "name": "Nemotron 3 Nano 30B" },
                      "minimax-m2.7":               { "name": "MiniMax M2.7" },
                      "minimax-m2.5":               { "name": "MiniMax M2.5" },
                      "minimax-m2.1":               { "name": "MiniMax M2.1" },
                      "minimax-m2":                 { "name": "MiniMax M2" },
                      "gpt-oss:120b":               { "name": "GPT-OSS 120B" },
                      "gpt-oss:20b":                { "name": "GPT-OSS 20B" },
                      "gemini-3-flash-preview":     { "name": "Gemini 3 Flash Preview" },
                      "rnj-1:8b":                   { "name": "RNJ-1 8B" }
                    }
                  }
                }
              }
              EOF
              echo "OpenCode Ollama cloud config written to /paperclip/.config/opencode/opencode.json"
          env:
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: OLLAMA_API_KEY
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
      containers:
        - name: wohlig-agents
          image: asia-south1-docker.pkg.dev/wohlig/pocketstudio/wohlig-agents:1dcd539
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: PAPERCLIP_PUBLIC_URL
              value: "https://agents.pocketstudio.ai"
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: "authenticated"
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: "public"
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: "agents.pocketstudio.ai"
            - name: SERVE_UI
              value: "true"
            # Auth
            - name: PAPERCLIP_AUTH_BASE_URL_MODE
              value: "explicit"
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: "false"
            # Heartbeat scheduler for agent wake-ups
            - name: HEARTBEAT_SCHEDULER_ENABLED
              value: "true"
            - name: HEARTBEAT_SCHEDULER_INTERVAL_MS
              value: "30000"
            # Disable telemetry for self-hosted
            - name: PAPERCLIP_TELEMETRY_DISABLED
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            # Instance identity
            - name: PAPERCLIP_INSTANCE_ID
              value: "default"
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: DATABASE_URL
            # Auth secrets
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_ID
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_SECRET
            # LLM API keys injected into agent runtime environments
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
          securityContext: {}
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: wohlig-agents-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wohlig-agents-pvc
  namespace: pocketstudio-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard-rwo
