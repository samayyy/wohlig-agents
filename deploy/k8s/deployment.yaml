apiVersion: apps/v1
kind: Deployment
metadata:
  name: wohlig-agents
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wohlig-agents
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wohlig-agents
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: wohlig-agents
          image: asia-south1-docker.pkg.dev/wohlig/pocketstudio/wohlig-agents:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: PAPERCLIP_PUBLIC_URL
              value: "https://agents.pocketstudio.ai"
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: "authenticated"
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: "private"
            - name: SERVE_UI
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_ID
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: wohlig-agents-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wohlig-agents-pvc
  namespace: pocketstudio-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard-rwo
