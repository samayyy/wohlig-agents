apiVersion: apps/v1
kind: Deployment
metadata:
  name: wohlig-agents
  namespace: pocketstudio-prod
  labels:
    app: wohlig-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wohlig-agents
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wohlig-agents
    spec:
      initContainers:
        # Writes the OpenCode provider config to the PVC so the opencode_local
        # adapter sees Ollama cloud as a named provider with the correct models.
        # Uses @ai-sdk/openai-compatible pointing at api.ollama.ai/v1.
        # Overwrites on every pod start to keep the API key current.
        - name: opencode-config-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /paperclip/.config/opencode
              cat > /paperclip/.config/opencode/opencode.json << EOF
              {
                "\$schema": "https://opencode.ai/config.json",
                "provider": {
                  "ollama": {
                    "npm": "@ai-sdk/openai-compatible",
                    "name": "Ollama Cloud",
                    "options": {
                      "baseURL": "https://api.ollama.ai/v1",
                      "apiKey": "${OLLAMA_API_KEY}"
                    },
                    "models": {
                      "deepseek-v3":              { "name": "DeepSeek V3 671B" },
                      "deepseek-r1:671b":         { "name": "DeepSeek R1 671B" },
                      "deepseek-r1:70b":          { "name": "DeepSeek R1 70B" },
                      "deepseek-r1:32b":          { "name": "DeepSeek R1 32B" },
                      "deepseek-r1:14b":          { "name": "DeepSeek R1 14B" },
                      "deepseek-r1:7b":           { "name": "DeepSeek R1 7B" },
                      "deepseek-coder-v2:236b":   { "name": "DeepSeek Coder V2 236B" },
                      "deepseek-coder-v2:16b":    { "name": "DeepSeek Coder V2 16B" },
                      "qwen3:235b":               { "name": "Qwen 3 235B MoE" },
                      "qwen3:32b":                { "name": "Qwen 3 32B" },
                      "qwen3:14b":                { "name": "Qwen 3 14B" },
                      "qwen3:8b":                 { "name": "Qwen 3 8B" },
                      "qwen3-coder:480b":         { "name": "Qwen 3 Coder 480B MoE" },
                      "qwen3-coder:32b":          { "name": "Qwen 3 Coder 32B" },
                      "qwen2.5-coder:32b":        { "name": "Qwen 2.5 Coder 32B" },
                      "qwen2.5-coder:14b":        { "name": "Qwen 2.5 Coder 14B" },
                      "qwen2.5-coder:7b":         { "name": "Qwen 2.5 Coder 7B" },
                      "qwen2.5:72b":              { "name": "Qwen 2.5 72B" },
                      "gemma4:27b":               { "name": "Gemma 4 27B" },
                      "gemma4:12b":               { "name": "Gemma 4 12B" },
                      "gemma4:4b":                { "name": "Gemma 4 4B" },
                      "gemma3:27b":               { "name": "Gemma 3 27B" },
                      "gemma3:9b":                { "name": "Gemma 3 9B" },
                      "glm-5.1:cloud":            { "name": "GLM-5.1 Cloud" },
                      "glm4:9b":                  { "name": "GLM-4 9B" },
                      "glm-z1-rumination:32b":    { "name": "GLM-Z1 Rumination 32B" },
                      "devstral:24b":             { "name": "Devstral 24B (Mistral Coding)" },
                      "codestral:22b":            { "name": "Codestral 22B (Mistral Code)" },
                      "llama4:scout":             { "name": "Llama 4 Scout 17B" },
                      "llama3.3:70b":             { "name": "Llama 3.3 70B" },
                      "llama3.1:70b":             { "name": "Llama 3.1 70B" },
                      "llama3.1:8b":              { "name": "Llama 3.1 8B" },
                      "starcoder2:15b":           { "name": "StarCoder 2 15B" },
                      "codegemma:7b":             { "name": "CodeGemma 7B" },
                      "phi4:14b":                 { "name": "Phi 4 14B" },
                      "mistral:7b":               { "name": "Mistral 7B" },
                      "codellama:34b":            { "name": "Code Llama 34B" }
                    }
                  }
                }
              }
              EOF
              echo "OpenCode Ollama cloud config written to /paperclip/.config/opencode/opencode.json"
          env:
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: OLLAMA_API_KEY
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
      containers:
        - name: wohlig-agents
          image: asia-south1-docker.pkg.dev/wohlig/pocketstudio/wohlig-agents:8a787a5
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3100"
            - name: PAPERCLIP_PUBLIC_URL
              value: "https://agents.pocketstudio.ai"
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: "authenticated"
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: "public"
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: "agents.pocketstudio.ai"
            - name: SERVE_UI
              value: "true"
            # Auth
            - name: PAPERCLIP_AUTH_BASE_URL_MODE
              value: "explicit"
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: "false"
            # Heartbeat scheduler for agent wake-ups
            - name: HEARTBEAT_SCHEDULER_ENABLED
              value: "true"
            - name: HEARTBEAT_SCHEDULER_INTERVAL_MS
              value: "30000"
            # Disable telemetry for self-hosted
            - name: PAPERCLIP_TELEMETRY_DISABLED
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            # Instance identity
            - name: PAPERCLIP_INSTANCE_ID
              value: "default"
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: DATABASE_URL
            # Auth secrets
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_ID
            - name: BETTER_AUTH_SOCIAL_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: GOOGLE_CLIENT_SECRET
            # LLM API keys injected into agent runtime environments
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wohlig-agents-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: paperclip-data
              mountPath: /paperclip
          securityContext: {}
      volumes:
        - name: paperclip-data
          persistentVolumeClaim:
            claimName: wohlig-agents-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wohlig-agents-pvc
  namespace: pocketstudio-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard-rwo
